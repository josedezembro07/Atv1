<div style="padding: 15px;">
  <h2>Galeria de Imagens</h2>
  
  
  <div style="margin-bottom: 20px;">
    <button routerLink="/detalhe" style="padding: 8px 15px; cursor: pointer; margin-right: 10px;">Ver Detalhe da Imagem</button>
    <button routerLink="/" style="padding: 8px 15px; cursor: pointer;">Voltar ao Início</button>
  </div>

 
  <div style="display: grid; grid-template-columns: repeat(3, 1fr); gap: 15px;">
    <img src="https://picsum.photos/200/150?random=1" alt="Imagem 1" style="border-radius: 8px;">
    <img src="https://picsum.photos/200/150?random=2" alt="Imagem 2" style="border-radius: 8px;">
    <img src="https://picsum.photos/200/150?random=3" alt="Imagem 3" style="border-radius: 8px;">
    <img src="https://picsum.photos/200/150?random=4" alt="Imagem 4" style="border-radius: 8px;">
    <img src="https://picsum.photos/200/150?random=5" alt="Imagem 5" style="border-radius: 8px;">
    <img src="https://picsum.photos/200/150?random=6" alt="Imagem 6" style="border-radius: 8px;">
  </div>
</div>
